name: Preview asset checks

on:
  pull_request:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  public-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check workspace.mjs
          node --check services/question-groups.mjs
          node --check services/question-data.mjs
          node --check services/question-selection.mjs
          node --check services/selection-export.mjs
      - name: Verify release files and approved question bodies
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          import re
          from pathlib import Path
          allowed = {'README.md', '.github/workflows/preview-checks.yml', 'index.html', 'styles.css', 'app.mjs', 'favicon.svg', '.nojekyll', 'services/question-data.mjs', 'services/question-selection.mjs', 'services/selection-export.mjs', 'assets/seu-emblem.png', 'assets/question-c044.png', 'designs/index.html', 'designs/LICENSE-oil-ui.txt', 'designs/red-emphasis/index.html', 'designs/red-emphasis/LICENSE-oil-ui.txt', 'designs/seu-workspace/index.html', 'designs/seu-workspace/LICENSE-oil-ui.txt', 'designs/classroom-workspace/index.html', 'designs/classroom-workspace/LICENSE-oil-ui.txt'}
          allowed.update({'workspace.html', 'workspace.css', 'workspace.mjs', 'services/question-groups.mjs'})
          actual = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          if actual != allowed:
              raise SystemExit(f'Unexpected release files: {actual ^ allowed}')
          digests = {
              'services/question-data.mjs': '7d59f241b01a852f46a0ea8876f0dcaae25c4c99906ccce371d387ce6029fd5a',
              'assets/seu-emblem.png': '77afdde14094540f94787ba32722c04c2532647fa60a6820e7c5bd0b5d0cfc8f',
              'assets/question-c044.png': 'fb2d7e0e3493b2f66ee7cac6abfe068e8a738315a21018788becfd54c378170a',
          }
          for name, digest in digests.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Unapproved source content or image: ' + name)
          for name in actual:
              if name.endswith(('.html', '.mjs', '.css', '.svg')):
                  forbidden = r'RCB-Q\d{3}|SRC-(?:WORD|PPT)-|correct_option_id|questions\.draft|"(?:answer|explanation|correctAnswer)"\s*:'
                  if not name.startswith('designs/'):
                      forbidden += r'|\b(?:answers?|explanation|correctAnswer)[\'\"]?\s*[:=]'
                  if name not in {'designs/seu-workspace/index.html', 'designs/classroom-workspace/index.html', 'services/question-data.mjs'}:
                      forbidden += r'|QB-RC-[CFT]\d{3}'
                  text = Path(name).read_text()
                  if re.search(forbidden, text):
                      raise SystemExit('Private content in public asset: ' + name)
                  if not name.startswith('designs/'):
                      inspected = re.sub(r'xmlns=\\?"http://www\.w3\.org/(?:2000/svg|1998/Math/MathML)\\?"', '', text)
                      if re.search(r'https?://', inspected):
                          raise SystemExit('External resource in formal UI: ' + name)
          print('24 release files verified; approved bodies and images pinned; no answers or source documents.')
          PY
