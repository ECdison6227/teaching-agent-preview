name: Preview asset checks

on:
  pull_request:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  public-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check services/demo-classroom.mjs
          node --check services/demo-data.mjs
      - name: Confirm only demonstration assets are tracked
        run: |
          python3 - <<'PY'
          import subprocess
          import re
          from pathlib import Path
          allowed = {'README.md', '.github/workflows/preview-checks.yml', 'index.html', 'styles.css', 'app.mjs', 'favicon.svg', '.nojekyll', 'services/demo-data.mjs', 'services/demo-classroom.mjs', 'designs/index.html', 'designs/LICENSE-oil-ui.txt', 'designs/red-emphasis/index.html', 'designs/red-emphasis/LICENSE-oil-ui.txt', 'designs/seu-workspace/index.html', 'designs/seu-workspace/LICENSE-oil-ui.txt'}
          actual = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          if actual != allowed:
              raise SystemExit(f'Unexpected release files: {actual ^ allowed}')
          for name in actual:
              if name.endswith(('.html', '.mjs', '.css', '.svg')):
                  # User authorized question bodies only in the new workspace comparison.
                  forbidden = r'RCB-Q\d{3}|SRC-(?:WORD|PPT)-|correct_option_id|questions\.draft|"(?:answer|explanation|correctAnswer)"\s*:'
                  if name != 'designs/seu-workspace/index.html':
                      forbidden += r'|QB-RC-[CFT]\d{3}'
                  if re.search(forbidden, Path(name).read_text()):
                      raise SystemExit('Private course content in public asset: ' + name)
          print('Public demonstration file list and private identifiers verified.')
          PY
