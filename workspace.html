<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>东南大学 · 选题组</title>
    <link rel="stylesheet" href="workspace.css" />
  </head>
  <body class="columns" data-variant="columns">
    <div class="shell">
      <header class="header">
        <div class="brand">
          <img
            src="assets/seu-emblem.png"
            alt="东南大学校徽"
            width="54"
            height="54"
          />
          <div>
            <strong>东南大学</strong>
            <p>混凝土结构 · 教师工作台</p>
          </div>
        </div>
        <span class="role">教师端</span>
      </header>
      <nav aria-label="课程导航">
        <button id="nav-groups" aria-current="page">选题组</button
        ><button id="nav-prepare" disabled>课堂准备</button
        ><button disabled>课堂记录</button>
      </nav>
      <div class="page-heading">
        <div>
          <p class="eyebrow">第 6 章 · 钢筋混凝土梁承载力计算原理</p>
          <h1 id="page-title">选题组</h1>
        </div>
      </div>
      <section class="confirm" id="discard-confirm" hidden role="alert">
        <p>当前修改尚未保存。是否放弃修改？</p>
        <div class="confirm-actions">
          <button id="keep" class="primary">继续编辑</button
          ><button id="discard">放弃修改</button>
        </div>
      </section>
      <main class="workspace">
        <aside class="group-panel" aria-label="选题组列表">
          <div class="section-heading">
            <h2>我的选题组</h2>
            <span class="count" id="group-count">0</span>
          </div>
          <div class="group-list" id="group-list">
            <div class="empty-groups">尚无选题组</div>
          </div>
          <button id="new-group" class="new-group">＋ 新建选题组</button>
        </aside>
        <section class="editor" aria-label="选题组编辑">
          <div class="editor-title">
            <div class="name-row">
              <label for="group-name">组名</label
              ><input
                id="group-name"
                maxlength="60"
                placeholder="输入选题组名称"
                value=""
                autocomplete="off"
              />
            </div>
            <div class="state-line">
              <span class="status unsaved" id="saved-state">未保存</span
              ><span>题目顺序</span>
            </div>
          </div>
          <div class="editor-tools">
            <p>共 <b class="count" id="editor-count">0</b> 道题</p>
            <button id="add-question" data-open-picker>＋ 添加题目</button>
          </div>
          <div id="question-list"></div>
        </section>
        <aside class="preparation" aria-label="课堂准备">
          <div class="prepare-heading">
            <h2>本次选题</h2>
            <span class="badge" id="prepare-state">未开课</span>
          </div>
          <div class="large-count">
            <span id="total-count">0</span><small>道题</small>
          </div>
          <div class="distribution">
            <span>单选<b id="single-count">0</b></span
            ><span>判断<b id="judge-count">0</b></span
            ><span>填空<b id="fill-count">0</b></span>
          </div>
          <div class="knowledge">
            <h3>知识点</h3>
            <ul id="knowledge-list">
              <li>尚未添加题目</li>
            </ul>
          </div>
          <div class="stack">
            <button id="save" class="primary">保存选题组</button
            ><button id="prepare" disabled>准备课堂</button>
          </div>
          <p id="notice" class="notice" role="status" aria-live="polite"></p>
          <section class="prepare-status" id="prepare-status">
            <h3 id="prepare-title">课堂准备</h3>
            <p id="prepare-description">选择并保存本次课堂题目</p>
            <button id="open-class" class="primary" disabled hidden>
              开课
            </button>
          </section>
        </aside>
      </main>
    </div>
    <div class="dialog-backdrop" id="picker-backdrop" hidden>
      <section
        class="picker"
        role="dialog"
        aria-modal="true"
        aria-labelledby="picker-title"
      >
        <div class="picker-head">
          <h2 id="picker-title">添加题目</h2>
          <button id="close-picker" aria-label="关闭添加题目">关闭</button>
        </div>
        <div class="picker-filters">
          <label
            >查找题目<input
              id="picker-search"
              type="search"
              placeholder="关键词或题号" /></label
          ><label
            >知识点<select id="picker-knowledge">
              <option value="">全部知识点</option>
              <option value="detailing">构造要求与材料</option>
              <option value="stages">受弯工作阶段</option>
              <option value="failure">受弯破坏与配筋率</option>
              <option value="principles">正截面计算基本原理</option>
              <option value="singly">单筋矩形截面</option>
              <option value="cracking">裂缝与正常使用</option>
              <option value="stiffness">刚度与变形</option>
              <option value="doubly">双筋矩形截面</option>
              <option value="t-section">T形截面</option>
              <option value="shear-modes">斜截面破坏与影响因素</option>
              <option value="shear-design">受剪承载力计算</option>
              <option value="shear-detailing">斜截面构造与弯起钢筋</option>
              <option value="torsion">补充题库：受扭与弯剪扭</option>
              <option value="continuous">补充题库：连续梁内力分析</option>
            </select></label
          ><label
            >题型<select id="picker-type">
              <option value="">全部题型</option>
              <option>单选</option>
              <option>判断</option>
              <option>填空</option>
            </select></label
          >
        </div>
        <div id="picker-results"></div>
        <div class="picker-pagination">
          <button id="picker-prev">上一页</button><span id="picker-page"></span
          ><button id="picker-next">下一页</button>
        </div>
      </section>
    </div>
    <template id="source-figure"
      ><img src="assets/question-c044.png" alt="原题44配图"
    /></template>
    <script type="module" src="workspace.mjs"></script>
  </body>
</html>
