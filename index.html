<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="教师选题、课堂统计与学生答题的前端演示。" />
    <title>教师工作台 · 钢筋混凝土梁</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">跳到主要内容</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true">梁</span>
          <span>专题教学空间</span>
        </a>
        <span class="demo-badge">前端演示</span>
        <button type="button" id="reset-demo">重置演示</button>
      </header>
      <nav class="primary-nav" aria-label="主要导航">
        <button type="button" data-view="prepare">课前选题</button>
        <button type="button" data-view="stats">课堂统计</button>
        <button type="button" data-view="student">学生视角</button>
      </nav>
      <main id="workspace" tabindex="-1"></main>
      <footer class="page-footer">
        <span>真实题库 PDF 单独交付</span>
        <span>本页使用示例数据，刷新后重置；实际课堂服务后续接入。</span>
      </footer>
    </div>
    <div id="notice" class="toast" role="status" aria-live="polite"></div>
    <noscript><p>请启用 JavaScript 体验界面操作。</p></noscript>
  </body>
</html>
